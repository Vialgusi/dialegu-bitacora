# CI: pruebas del motor y de la interfaz en cada PR y en cada push a main o a ramas feature/.
# No compila el instalador ni publica nada; eso lo hace release.yml con una etiqueta v*.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas del motor y de la interfaz
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias del motor
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip
          venv\Scripts\python.exe -m pip install -r backend/requirements-dev.txt

      # Las pruebas no descargan modelos ni usan audios reales: el motor se prueba con datos sintéticos.
      - name: Probar el motor
        run: venv\Scripts\python.exe -m pytest tests -q

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias de la interfaz
        working-directory: frontend
        run: npm ci

      - name: Probar, revisar y compilar la interfaz
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run build
