# Release: compila el motor y el instalador en Windows y deja un release en BORRADOR.
# Se dispara al subir una etiqueta v* (v0.3.0, por ejemplo) o a mano desde Actions.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de versión (por ejemplo, v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Compilar y crear release en borrador
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # El script motor:build compila con venv\Scripts\python.exe: se crea el mismo
      # entorno en la raíz y se instalan ahí las dependencias y PyInstaller.
      # Dialegu_Engine.spec toma el runtime de Visual C++ de System32 del runner.
      - name: Crear el entorno virtual e instalar dependencias
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip
          venv\Scripts\python.exe -m pip install -r backend/requirements-dev.txt

      # Si las pruebas fallan no se compila nada: un release roto no llega ni a borrador.
      - name: Probar el motor
        run: venv\Scripts\python.exe -m pytest tests -q

      - name: Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias de la interfaz
        working-directory: frontend
        run: npm ci

      - name: Probar y revisar la interfaz
        working-directory: frontend
        run: |
          npm test
          npm run lint

      # Mismo comando que usa el script motor:build de frontend/package.json
      - name: Compilar el motor con PyInstaller
        working-directory: frontend
        run: npm run motor:build

      - name: Compilar el instalador
        working-directory: frontend
        run: npm run electron:build -- --publish never

      - name: Calcular el SHA-256 del instalador
        run: |
          $instalador = Get-ChildItem dist-electron\*.exe | Select-Object -First 1
          $hash = (Get-FileHash $instalador.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($instalador.Name)" | Out-File dist-electron\SHA256SUMS.txt -Encoding ascii
          Get-Content dist-electron\SHA256SUMS.txt

      # draft: true -> queda como borrador; se revisa y publica a mano en GitHub.
      - name: Crear el release en borrador
        uses: softprops/action-gh-release@v2.4.1
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Dialegu Bitácora ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist-electron/*.exe
            dist-electron/SHA256SUMS.txt
